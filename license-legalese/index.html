<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License-Legalese // v1.0.0</title>
    
    <!-- Stable Native CSS Layout Layer -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0c111d;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 32px;
            position: relative;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title-icon { color: #f59e0b; font-weight: normal; }
        .version { color: #94a3b8; font-weight: 400; font-size: 20px; }
        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-top: 6px;
        }
        .tagline {
            position: absolute;
            top: 4px;
            right: 0;
            font-size: 10px;
            color: #334155;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px 16px;
            color: #f1f5f9;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #475569;
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            cursor: pointer;
        }
        
        .output-box {
            margin-top: 32px;
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px dashed rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            padding: 20px;
        }
        .output-title {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        textarea.code-display {
            background-color: #020617;
            border: 1px solid #0f172a;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
            height: 180px;
            resize: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- App Header Area -->
        <div class="header">
            <div class="title">
                <span class="title-icon">⚖️</span> License-Legalese <span class="version">// v1.0.0</span>
            </div>
            <p class="subtitle">Instantly build bulletproof image rights frameworks for digital contracts.</p>
            <div class="tagline">A GWMEDIA MARKETING INITIATIVE</div>
        </div>

        <!-- Form Entry Parameters -->
        <div class="form-group">
            <label for="licensor-name">Licensor Name / Studio</label>
            <input type="text" id="licensor-name" value="GWMEDIA Studio">
        </div>

        <div class="form-group">
            <label for="distribution-scope">Media Distribution Scope</label>
            <select id="distribution-scope">
                <option value="digital">Digital Web & Social Media</option>
                <option value="print">Print & Broadcast Media</option>
                <option value="full">Full Commercial Rights Bundle</option>
            </select>
        </div>

        <div class="form-group">
            <label for="duration-param">Duration Parameters</label>
            <select id="duration-param">
                <option value="1">1 Year Term</option>
                <option value="3">3 Year Term</option>
                <option value="perpetual">Perpetual / Unlimited</option>
            </select>
        </div>

        <!-- Generated Output Box -->
        <div class="output-box">
            <div class="output-title">Generated Contract Language Block</div>
            <textarea id="contract-output" class="code-display" readonly>IMAGE LICENSING RIDER // GRANTED BY: GWMEDIA Studio
Subject to final invoice balancing, the client is granted a non-exclusive, non-transferable right to use the generated imagery for Digital Web and Social Media channels only. This agreement remains valid for a period of exactly one (1) calendar year from invoice completion date. Copyright ownership remains exclusively with the original creator. Unauthorized usage beyond these parameters constitutes structural infringement.</textarea>
        </div>
    </div>

    <script>
        // Interactive legal layout compilation script logic
        const licensorInput = document.getElementById('licensor-name');
        const scopeSelect = document.getElementById('distribution-scope');
        const durationSelect = document.getElementById('duration-param');
        const outputArea = document.getElementById('contract-output');

        function updateContractBlock() {
            const name = licensorInput.value || "GWMEDIA Studio";
            const scopeText = scopeSelect.options[scopeSelect.selectedIndex].text;
            const durationText = durationSelect.options[durationSelect.selectedIndex].text.toLowerCase();
            
            outputArea.value = `IMAGE LICENSING RIDER // GRANTED BY: ${name}\nSubject to final invoice balancing, the client is granted a non-exclusive, non-transferable right to use the generated imagery for ${scopeText} channels only. This agreement remains valid for a period of exactly ${durationText} from invoice completion date. Copyright ownership remains exclusively with the original creator. Unauthorized usage beyond these parameters constitutes structural infringement.`;
        }

        licensorInput.addEventListener('input', updateContractBlock);
        scopeSelect.addEventListener('change', updateContractBlock);
        durationSelect.addEventListener('change', updateContractBlock);
    </script>
</body>
</html>
