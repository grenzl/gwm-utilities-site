<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Swiss Army Knife — ModuKit</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-glow: #38bdf8;
            --accent-hover: #0ea5e9;
            --error-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        .back-link {
            color: var(--accent-glow);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        textarea {
            width: 100%;
            height: 300px;
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-glow);
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent-glow);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.secondary {
            background-color: #334155;
            color: var(--text-main);
        }

        button.secondary:hover {
            background-color: #475569;
        }

        .message {
            padding: 1rem;
            border-radius: 6px;
            font-weight: 500;
            display: none;
        }

        .message.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .message.success {
            display: block;
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <!-- Returns neatly back to your root dashboard website -->
            <a href="../../" class="back-link">← Back to ModuKit Dashboard</a>
            <h1>📦 JSON Swiss Army Knife</h1>
            <p class="subtitle">Format, validate, or minify raw JSON data directly inside your browser sandbox.</p>
        </header>

        <div class="workspace">
            <div id="outputMessage" class="message"></div>

            <textarea id="jsonInput" placeholder="Paste your raw, unformatted JSON text here..."></textarea>

            <div class="controls">
                <button onclick="processJSON('format')">✨ Format (Pretty Print)</button>
                <button onclick="processJSON('minify')" class="secondary">🗜️ Minify</button>
                <button onclick="clearAll()" class="secondary">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <script>
        function processJSON(action) {
            const inputField = document.getElementById('jsonInput');
            const messageField = document.getElementById('outputMessage');
            const rawValue = inputField.value.trim();

            if (!rawValue) {
                showMessage('Please enter some JSON data first.', 'error');
                return;
            }

            try {
                // Try parsing the input to ensure it's valid JSON
                const parsedJSON = JSON.parse(rawValue);
                
                if (action === 'format') {
                    // Format JSON with 4 fluid spaces
                    inputField.value = JSON.stringify(parsedJSON, null, 4);
                    showMessage('JSON successfully formatted and validated!', 'success');
                } else if (action === 'minify') {
                    // Strip all spaces out
                    inputField.value = JSON.stringify(parsedJSON);
                    showMessage('JSON successfully compressed/minified!', 'success');
                }
            } catch (error) {
                // If it crashes, display the exact validation error message
                showMessage('Invalid JSON Structure: ' + error.message, 'error');
            }
        }

        function showMessage(text, type) {
            const messageField = document.getElementById('outputMessage');
            messageField.innerText = text;
            messageField.className = 'message ' + type;
        }

        function clearAll() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('outputMessage').style.display = 'none';
        }
    </script>

</body>
</html>
